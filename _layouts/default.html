<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="follow_it-verification-code" content="DumQfZmfXJN5jtC7tGkt" />
    {% feed_meta %}

    <!-- Styling and Visuals -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="stylesheet" href="/css/site.css" />

    <script>
        window.d3VizInits = [];
    </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Page metadata -->
    {% if page.title %}
    <title>Joshua Cole: {{ page.title }}</title>
    {% else %}
    <title>Joshua Cole</title>
    {% endif %}
    {% seo %}

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://joshuacol.es/#person",
          "name": "Joshua Cole",
          "url": "https://joshuacol.es",
          "image": "https://joshuacol.es/img/joshua.png",
          "jobTitle": "CEO & Founder",
          "worksFor": { "@id": "https://joshuacol.es/#organization" },
          "alumniOf": [
            { "@type": "Organization", "name": "Walmart", "url": "https://tech.walmart.com/" },
            { "@type": "Organization", "name": "Meta", "url": "https://ai.meta.com/" },
            { "@type": "Organization", "name": "Amazon", "url": "https://developer.amazon.com/alexa" }
          ],
          "knowsAbout": ["game theory", "counterfactual regret minimization", "information theory", "machine learning", "software engineering", "equilibrium computation"],
          "sameAs": [
            "https://github.com/jcolechanged",
            "https://twitter.com/combinatoricole",
            "https://news.ycombinator.com/user?id=JoshCole"
          ]
        },
        {
          "@type": "Organization",
          "@id": "https://joshuacol.es/#organization",
          "name": "Mieza",
          "alternateName": "TackTech AI",
          "url": "https://tacktech.ai",
          "founder": { "@id": "https://joshuacol.es/#person" },
          "description": "Game-theoretic AI company that computes provably optimal strategies for domains with hidden information and adversarial dynamics."
        }{% if page.layout == "post" %},
        {
          "@type": "Article",
          "headline": {{ page.title | jsonify }},
          "author": { "@id": "https://joshuacol.es/#person" },
          "publisher": { "@id": "https://joshuacol.es/#organization" },
          "url": "{{ page.url | absolute_url }}"{% if page.date %},
          "datePublished": "{{ page.date | date_to_xmlschema }}"{% endif %}{% if page.description %},
          "description": {{ page.description | jsonify }}{% endif %}
        }{% endif %}
      ]
    }
    </script>

</head>

<body class="min-h-screen flex flex-col bg-white">
    <header class="border-b bg-white/80 backdrop-blur">
      <div class="max-w-6xl mx-auto w-full px-4 py-3 flex items-center justify-between">
        <a class="text-slate-900 font-bold text-lg" href="/">Joshua Cole</a>
        <button id="nav-toggle" class="md:hidden p-2 text-slate-700" aria-label="Toggle navigation">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <nav id="nav-menu" class="hidden md:flex items-center gap-4">
          <a class="text-slate-700 hover:text-blue-700" href="/">Home</a>
          <a class="text-slate-700 hover:text-blue-700" href="/writing.html">Writing</a>
          <a class="text-slate-700 hover:text-blue-700" href="/projects.html">Projects</a>
          <a class="text-slate-700 hover:text-blue-700" href="/research.html">Research</a>
          <a class="text-slate-700 hover:text-blue-700" href="/links.html">Links</a>
          <a class="btn"
             href="mailto:joshua@tacktech.ai">Get in touch</a>
        </nav>
      </div>
      <div id="nav-mobile" class="hidden md:hidden border-t border-slate-200 px-4 py-3">
        <div class="flex flex-col gap-3">
          <a class="text-slate-700 hover:text-blue-700" href="/">Home</a>
          <a class="text-slate-700 hover:text-blue-700" href="/writing.html">Writing</a>
          <a class="text-slate-700 hover:text-blue-700" href="/projects.html">Projects</a>
          <a class="text-slate-700 hover:text-blue-700" href="/research.html">Research</a>
          <a class="text-slate-700 hover:text-blue-700" href="/links.html">Links</a>
          <a class="btn text-center"
             href="mailto:joshua@tacktech.ai">Get in touch</a>
        </div>
      </div>
    </header>
    <script>
      document.getElementById('nav-toggle').addEventListener('click', function() {
        document.getElementById('nav-mobile').classList.toggle('hidden');
      });
    </script>
    <main class="max-w-6xl mx-auto w-full px-4 py-6">
      {{ content }}
    </main>

    <script type="text/javascript" src="/js/jquery-3.3.1.slim.min.js"></script>
    <script type="text/javascript" src="/js/d3.5.9.1.min.js"></script>
    <script type="text/javascript" src="/js/underscore.js"></script>
    <script type="text/javascript" src="/js/visualization.js"></script>
    <script type="text/javascript" src="/js/horizon.js"></script>
    <script type="text/javascript" src="/js/popfoots.js"></script>
    {% include footer.html %}
</body>

</html>
